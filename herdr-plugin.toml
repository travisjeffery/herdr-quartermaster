id = "quartermaster"
name = "Quartermaster"
version = "0.5.1"
min_herdr_version = "0.9.1"
description = "One coordinator, a worktree and agent per bead, beads as the only record."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/build.sh"]

[[startup]]
command = ["bin/quartermaster", "startup"]

[[actions]]
id = "configure"
title = "Quartermaster: set up (config for this workspace's repo, CLI link, agent view)"
contexts = ["workspace"]
command = ["bin/quartermaster", "configure"]

[[actions]]
id = "board"
title = "Quartermaster: board"
contexts = ["global", "workspace"]
command = ["bin/quartermaster", "action", "board"]

[[actions]]
id = "coordinator"
title = "Quartermaster: open the coordinator"
contexts = ["global", "workspace"]
command = ["bin/quartermaster", "coordinator"]

[[actions]]
id = "focus-clipboard"
title = "Quartermaster: focus or start the bead on the clipboard"
contexts = ["global", "workspace"]
command = ["bin/quartermaster", "focus"]

[[actions]]
id = "focus-clipboard-codex"
title = "Quartermaster: focus or start the bead on the clipboard (Codex)"
contexts = ["global", "workspace"]
command = ["bin/quartermaster", "focus", "--agent", "codex"]

[[actions]]
id = "focus-clipboard-muse"
title = "Quartermaster: focus or start the bead on the clipboard (Muse Code)"
contexts = ["global", "workspace"]
command = ["bin/quartermaster", "focus", "--agent", "muse"]

[[panes]]
id = "board"
title = "Quartermaster"
placement = "popup"
width = "85%"
height = "80%"
command = ["bin/quartermaster", "board"]
