<text x="20" y="484.4" fill="#c0caf5" font-weight="bold" textLength="92.4" lengthAdjust="spacingAndGlyphs">Description</text>
<text x="20" y="504.4" fill="#c0caf5" textLength="823.2" lengthAdjust="spacingAndGlyphs">  One noisy client can slow the API down for everyone. Add a limiter in front of /api that answers</text>
<text x="20" y="524.4" fill="#c0caf5" textLength="403.20000000000005" lengthAdjust="spacingAndGlyphs">  429 with Retry-After, and document the limits.</text>
<text x="20" y="564.4" fill="#c0caf5" font-weight="bold" textLength="117.60000000000001" lengthAdjust="spacingAndGlyphs">Waiting on you</text>
<text x="20" y="584.4" fill="#c0caf5" textLength="411.6" lengthAdjust="spacingAndGlyphs">  Draft PR: https://github.com/acme/notes/pull/50</text>
<text x="20" y="604.4" fill="#c0caf5" textLength="831.6" lengthAdjust="spacingAndGlyphs">  Question: limit per API key or per client IP? (a) per key, 100 req/min, anonymous calls share one</text>
<text x="20" y="624.4" fill="#c0caf5" textLength="537.6" lengthAdjust="spacingAndGlyphs">  bucket (b) per IP, 60 req/min (c) both, whichever trips first.</text>
<text x="20" y="644.4" fill="#565f89" textLength="176.4" lengthAdjust="spacingAndGlyphs">  A answers notes-7qk</text>
<text x="20" y="684.4" fill="#c0caf5" font-weight="bold" textLength="327.6" lengthAdjust="spacingAndGlyphs">History (2 earlier notes, newest first)</text>
<text x="20" y="704.4" fill="#565f89" textLength="663.6" lengthAdjust="spacingAndGlyphs">  Token bucket in internal/ratelimit with tests; not wired into the router yet.</text>
