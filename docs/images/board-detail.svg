<text x="20" y="404.4" fill="#f7768e" textLength="226.8" lengthAdjust="spacingAndGlyphs">needs you · PR #50 · APP-14</text>
<text x="20" y="444.4" fill="#c0caf5" font-weight="bold" textLength="92.4" lengthAdjust="spacingAndGlyphs">Description</text>
<text x="20" y="464.4" fill="#c0caf5" textLength="823.2" lengthAdjust="spacingAndGlyphs">  One noisy client can slow the API down for everyone. Add a limiter in front of /api that answers</text>
<text x="20" y="484.4" fill="#c0caf5" textLength="403.20000000000005" lengthAdjust="spacingAndGlyphs">  429 with Retry-After, and document the limits.</text>
<text x="20" y="524.4" fill="#c0caf5" font-weight="bold" textLength="193.20000000000002" lengthAdjust="spacingAndGlyphs">Latest note (3 earlier)</text>
<text x="20" y="544.4" fill="#c0caf5" textLength="831.6" lengthAdjust="spacingAndGlyphs">  Question: limit per API key or per client IP? (a) per key, 100 req/min, anonymous calls share one</text>
<text x="20" y="564.4" fill="#c0caf5" textLength="537.6" lengthAdjust="spacingAndGlyphs">  bucket (b) per IP, 60 req/min (c) both, whichever trips first.</text>
