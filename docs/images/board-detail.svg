<text x="20" y="744.4" fill="#c0caf5" font-weight="bold" textLength="243.60000000000002" lengthAdjust="spacingAndGlyphs">Agent notes-7qk · claude idle</text>
<text x="20" y="764.4" fill="#565f89" textLength="672" lengthAdjust="spacingAndGlyphs">  ● The limiter is in internal/ratelimit (token bucket, 14 tests), and the draft</text>
<text x="20" y="784.4" fill="#565f89" textLength="638.4" lengthAdjust="spacingAndGlyphs">    PR is up. Before I wire it into the router I need one decision from you:</text>
<text x="20" y="804.4" fill="#565f89" textLength="663.6" lengthAdjust="spacingAndGlyphs">    should the limit be per API key, per client IP, or both? Noted on the bead.</text>
